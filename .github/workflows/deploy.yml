name: Build and deploy website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Validate and build menu from Excel
        run: npm run build:menu

      - name: Prepare site directory
        run: |
          mkdir -p _site
          cp -r index.html styles.css script.js site.js site-actions.js _site/
          cp -r agent-manifest.json aahira_kitchen.network.json links.json agent-mcp.json _site/
          cp -r data runtime i18n _site/
          if [ -d "bridge" ]; then cp -r bridge _site/; fi
          if [ -d ".well-known" ]; then cp -r .well-known _site/; fi
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
